<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SteelVault — Collection Steelbook</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#121417" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SteelVault" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <span class="topbar-time" id="clock">9:41</span>
    <span class="topbar-title">STEELVAULT</span>
    <span class="topbar-status" id="save-indicator"></span>
  </header>

  <main id="content"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="collection">
      <svg viewBox="0 0 24 24" class="icon"><path d="M4 4h16v16H4z"/><path d="M4 4l16 16M20 4L4 20"/></svg>
      <span>Collection</span>
    </button>
    <button class="tab-btn" data-tab="wishlist">
      <svg viewBox="0 0 24 24" class="icon"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.2 5.5 3.5C14 6.2 15.5 5 17.5 5 21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21z"/></svg>
      <span>Envies</span>
    </button>
    <button class="tab-btn" data-tab="alerts">
      <svg viewBox="0 0 24 24" class="icon"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Alertes</span>
      <span class="tab-badge" id="alerts-badge"></span>
    </button>
  </nav>

  <button class="fab" id="fab-add">
    <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14"/></svg>
  </button>

</div>

<div id="modal-root"></div>

<script src="config.js"></script>
<script src="db.js"></script>
<script src="tmdb.js"></script>
<script src="app.js"></script>
</body>
</html>
